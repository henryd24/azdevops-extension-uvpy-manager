<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="UvPy Manager">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4584b6"/>
      <stop offset="1" stop-color="#2b5b84"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe873"/>
      <stop offset="1" stop-color="#ffd43b"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e879f9"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <!-- Python blue background -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- uv violet circular arrow: virtual environment / switching versions -->
  <circle cx="64" cy="64" r="44" fill="none" stroke="url(#ring)" stroke-width="8" stroke-linecap="round" stroke-dasharray="200 77" transform="rotate(100 64 64)"/>
  <path d="M97 62h22l-11 17z" fill="#c26bf5" stroke="#c26bf5" stroke-width="2" stroke-linejoin="round"/>
  <!-- Python yellow bolt: speed -->
  <path transform="translate(64 64) scale(.82) translate(-64 -64)" d="M72 18 38 70h22l-8 40 38-56H69z" fill="url(#bolt)" stroke="#1e3a52" stroke-opacity=".35" stroke-width="2" stroke-linejoin="round"/>
</svg>
