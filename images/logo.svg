<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="UvPy Manager">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f5d6e"/>
      <stop offset="1" stop-color="#0a2f45"/>
    </linearGradient>
    <clipPath id="clip"><rect width="128" height="128" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="128" height="128" fill="url(#bg)"/>
    <path d="M-4 24C20 8 40 38 64 24s46-20 74-6v-40H-4z" fill="#1c8a99" fill-opacity=".5"/>
    <path d="M-4 112C24 98 44 124 70 112s40-14 66-4v30H-4z" fill="#2aa5b3" fill-opacity=".35"/>
  </g>

  <!-- snake: tail behind the cube -->
  <path d="M28 28C16 36 11 50 16 64S22 74 26 78" fill="none" stroke="#0a2f45" stroke-width="15" stroke-linecap="round"/>
  <path d="M28 28C16 36 11 50 16 64S22 74 26 78" fill="none" stroke="#3b7fb5" stroke-width="11" stroke-linecap="round"/>

  <!-- uv cube (violet) -->
  <g transform="translate(64 50) scale(.98) translate(-64 -68)">
    <path d="M64 30 97 49 64 68 31 49z" fill="#7566c2"/>
    <path d="M31 49 64 68v38L31 87z" fill="#5240a0"/>
    <path d="M64 68 97 49v38l-33 19z" fill="#2f2461"/>
    <g transform="matrix(1 .5758 0 1 31 49)" fill="none" stroke="#fdf3dc" stroke-width="5.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 12v12a4.6 4.6 0 0 0 9.2 0V12"/>
      <path d="M20 12l5.2 17L30.4 12"/>
    </g>
  </g>

  <!-- snake: body in front of the cube, rising head on the right -->
  <path d="M24 78C44 98 88 98 106 78S118 58 104 50" fill="none" stroke="#0a2f45" stroke-width="15" stroke-linecap="round"/>
  <path d="M24 78C44 98 88 98 106 78S118 58 104 50" fill="none" stroke="#3b7fb5" stroke-width="11" stroke-linecap="round"/>
  <path d="M24 78C44 98 88 98 106 78S118 58 104 50" fill="none" stroke="#ffd43b" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="1 7" transform="translate(0 2)"/>

  <!-- head -->
  <g transform="translate(104 46) rotate(-20)">
    <path d="M0 -3 6 -11" stroke="#e5484d" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M6 -11l3-2M6 -11l-1-4" stroke="#e5484d" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    <ellipse cx="0" cy="3" rx="11" ry="9" fill="#3b7fb5" stroke="#0a2f45" stroke-width="2.5"/>
    <circle cx="4" cy="0" r="3.2" fill="#fff"/>
    <circle cx="4.8" cy="0" r="1.6" fill="#0a2f45"/>
  </g>
</svg>
